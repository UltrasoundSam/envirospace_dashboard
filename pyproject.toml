[project]
name = "envirospace-dashboard"
version = "0.1.2"
description = "Repo for data ingestion and dashboard set up for INC Lab Simulus Campus Map. Sister Repo to https://github.com/UltrasoundSam/envirospace_monitor"
readme = "README.md"
authors = [
    { name = "Sam Hill", email = "s.hill@yorksj.ac.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "paho-mqtt>=2.2.0",
    "pandas>=3.1.1",
    "pymysql>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
envirospace-dashboard = "envirospace_dashboard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
